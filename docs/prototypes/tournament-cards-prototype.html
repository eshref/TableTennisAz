<!doctype html>
<!-- Throwaway design prototype. Compare three podium layouts using the same sample tournaments. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableTennisAz · Tournament cards prototype</title>
<style>
  :root {
    color-scheme: light;
    --ink: #183125;
    --muted: #536b5d;
    --primary: #006b50;
    --line: #dbe6de;
    --surface: #fff;
    --app-bg: #f5f9f6;
    --soft: #dcefe2;
    --red: #cf303d;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #eaf1ec;
  }

  * { box-sizing: border-box; }
  body { margin: 0; min-width: 280px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #007e5c; outline-offset: 3px; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  img { display: block; }

  .workspace {
    min-height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 422px) minmax(0, 300px);
    align-items: start;
    justify-content: center;
    gap: clamp(26px, 6vw, 84px);
    padding: clamp(24px, 6vh, 65px) 24px 98px;
  }

  .phone {
    background: var(--app-bg);
    border: 1px solid #c6d5ca;
    border-radius: 27px;
    box-shadow: 0 20px 60px #193d2620, 0 2px 8px #193d260d;
    height: min(778px, calc(100dvh - 147px));
    min-height: 480px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .app-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1;
  }

  .app-bar h2 { font-size: 20px; font-weight: 720; letter-spacing: -.025em; }
  .icon-button {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--surface);
  }

  .icon, .icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: 0 0 auto; }
  .icon-button .dot { position: absolute; top: 6px; right: 6px; box-shadow: 0 0 0 2px white; }

  .screen { flex: 1 1 auto; overflow: auto; padding: 15px; scrollbar-width: thin; }
  .search {
    display: flex;
    gap: 9px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
    margin-bottom: 13px;
    padding: 0 12px;
    color: var(--muted);
  }

  .search:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }
  .search input { width: 100%; min-width: 0; padding: 12px 0; border: 0; background: transparent; color: var(--ink); outline: 0; }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
  .stack { display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 14px; }
  .tournament { position: relative; }
  .tournament h3, .result-title { font-size: 17px; line-height: 1.25; letter-spacing: -.015em; }
  .facts { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 9px; color: var(--muted); font-size: 12px; font-weight: 580; }
  .facts span { display: inline-flex; align-items: center; gap: 5px; }
  .facts .icon { width: 14px; height: 14px; }
  .card-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 11px 0 0;
    margin-top: 12px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    text-align: left;
    color: var(--primary);
    font-size: 13px;
    font-weight: 730;
  }
  .card-link::after { content: ""; position: absolute; inset: 0; border-radius: 17px; }
  .tournament:has(.card-link:hover) { border-color: #99b6a3; }
  .tournament:has(.card-link:focus-visible) { outline: 3px solid var(--primary); outline-offset: 2px; }
  .card-link:focus-visible { outline: none; }

  .podium {
    margin-top: 14px;
    border-radius: 12px;
    background: #f3f7f3;
    padding: 10px;
  }

  .steps { display: grid; grid-template-columns: 1fr 1.06fr 1fr; gap: 5px; }
  .step { display: flex; flex-direction: column; justify-content: end; align-items: center; min-width: 0; text-align: center; }
  .step .portraits { margin: 0 0 6px; }
  .step .names { min-height: 3.4em; display: grid; align-content: start; gap: 3px; }
  .steps:not(.paired) .names { min-height: 2.1em; }
  .names { font-size: 11px; line-height: 1.19; font-weight: 650; overflow-wrap: anywhere; }
  .portrait { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: center 27%; background: #d9e7dd; border: 2px solid white; }
  .portraits { display: flex; justify-content: center; }
  .portraits .portrait + .portrait { margin-left: -7px; }
  .step.gold .portrait { width: 42px; height: 42px; }
  .step-base { align-self: stretch; display: grid; place-items: center; border-radius: 8px 8px 4px 4px; margin-top: 4px; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gold { --medal-bg: #f4e3ae; --medal-ink: #6d4b04; }
  .silver { --medal-bg: #e0e8ec; --medal-ink: #42566d; }
  .bronze { --medal-bg: #f1dfd3; --medal-ink: #764529; }
  .step-base, .medal { color: var(--medal-ink); background: var(--medal-bg); }
  .gold .step-base { height: 39px; }
  .silver .step-base { height: 30px; }
  .bronze .step-base { height: 23px; }

  .medal-rows { padding: 0 10px; }
  .medal-row { display: grid; grid-template-columns: 27px 1fr; gap: 9px; align-items: center; min-height: 57px; padding: 8px 0; }
  .medal-row + .medal-row { border-top: 1px solid var(--line); }
  .medal { width: 25px; height: 25px; display: inline-grid; place-items: center; border-radius: 50%; font-size: 12px; font-weight: 800; }
  .row-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .row-player { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .row-player .portrait { width: 29px; height: 29px; flex: 0 0 29px; }

  .spotlight { background: #faf5e6; }
  .spotlight-place { display: flex; align-items: center; gap: 10px; padding-bottom: 9px; }
  .spotlight-place .portrait { width: 46px; height: 46px; }
  .spotlight-place .names { font-size: 12px; }
  .spotlight-place .names span { display: block; }
  .spotlight-runners { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #e5dbc0; padding-top: 8px; gap: 6px; }
  .runner { display: flex; align-items: start; gap: 5px; }
  .runner .medal { width: 21px; height: 21px; flex: 0 0 21px; }
  .runner .names span { display: block; }

  .empty { padding: 28px 10px; text-align: center; color: var(--muted); }
  .day { color: var(--muted); font-size: 12px; font-weight: 680; margin: 4px 0 0; }
  .match { display: grid; gap: 7px; }
  .match-kind { font-size: 12px; color: var(--muted); }
  .score-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .score-row span { min-width: 0; }
  .score { font-size: 15px; border-radius: 8px; background: var(--soft); padding: 4px 8px; color: var(--primary); }
  .ranking-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .ranking-row strong { margin-left: auto; color: var(--primary); }

  .drawer-overlay { position: absolute; inset: 0; z-index: 5; background: #15312366; display: flex; }
  .drawer { width: min(85%, 310px); background: var(--surface); padding: 18px 12px; border-radius: 0 19px 19px 0; overflow: auto; }
  .drawer-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 3px 14px; }
  .drawer-title strong { font-size: 16px; }
  .drawer-nav { display: grid; gap: 4px; }
  .destination { display: flex; gap: 8px; align-items: center; justify-content: space-between; text-align: left; min-height: 48px; border: 0; border-radius: 11px; background: transparent; padding: 9px 12px; font-weight: 650; }
  .destination[aria-current="page"], .destination:hover { background: var(--soft); color: var(--primary); }

  .preview { padding-top: 19px; }
  .prototype-label { color: var(--primary); font-size: 12px; font-weight: 750; }
  .preview h1 { font-size: clamp(28px, 4vw, 39px); line-height: 1.04; letter-spacing: -.048em; margin: 6px 0 12px; }
  .preview p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .preview-options { margin-top: 27px; display: grid; gap: 9px; }
  .preview-options label { font-size: 13px; font-weight: 740; }
  .preview-options select, .simulate { width: 100%; min-height: 44px; border: 1px solid #c6d5ca; border-radius: 10px; padding: 8px 10px; background: #f8fbf8; color: var(--ink); }
  .simulate { margin-top: 7px; text-align: left; font-weight: 650; }
  .simulate:hover { border-color: var(--primary); }
  .variant-note { margin-top: 18px; border-top: 1px solid #c6d5ca; padding-top: 15px; }
  .variant-note strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .switcher {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: min(290px, calc(100vw - 20px));
    padding: 4px;
    border-radius: 100px;
    background: #19392a;
    color: #fff;
    box-shadow: 0 8px 26px #19392a3b;
  }
  .switcher button { width: 43px; height: 42px; border-radius: 50%; border: 0; background: #ffffff1a; color: white; font-size: 19px; }
  .switcher button:hover { background: #ffffff35; }
  .switcher button:focus-visible { outline-color: #b6e8cb; }
  .switcher output { text-align: center; font-size: 13px; font-weight: 720; }

  @media (max-width: 700px) {
    .workspace { grid-template-columns: minmax(0, 422px); padding: 0 8px 80px; gap: 14px; }
    .preview { grid-row: 1; padding: 13px 4px 0; }
    .preview h1 { font-size: 24px; margin: 2px 0 5px; }
    .preview-options { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .preview-options label { display: none; }
    .preview-options select, .simulate { width: 50%; margin: 0; font-size: 12px; min-height: 40px; }
    .variant-note { display: none; }
    .phone { height: auto; min-height: 558px; border-radius: 18px; }
    .screen { max-height: 78dvh; }
  }
</style>
</head>
<body>
<main class="workspace">
  <section class="phone" lang="az" aria-label="TableTennisAz tətbiqinin prototipi">
    <header class="app-bar" id="app-bar"></header>
    <div class="screen" id="screen"></div>
    <div class="drawer-overlay" id="overlay" hidden></div>
  </section>

  <aside class="preview" aria-label="Prototype controls">
    <div class="prototype-label">TableTennisAz · Prototype</div>
    <h1>Tournament cards</h1>
    <p>Compare three doubles podiums using the same sample tournaments. Placements and scores are illustrative. Use the app menu or the view selector to try the other screens.</p>
    <div class="preview-options">
      <label for="view">Preview screen</label>
      <select id="view" aria-label="Preview screen">
        <option value="rankings">Reytinq</option>
        <option value="singles">Şəxsi turnirlər</option>
        <option value="doubles">Qoşa turnirlər</option>
        <option value="duels">Duellər</option>
        <option value="results">Turnirin matç nəticələri</option>
      </select>
      <button type="button" class="simulate" id="simulate">Simulate new tournaments</button>
    </div>
    <div class="variant-note">
      <strong id="variant-heading"></strong>
      <p id="variant-description"></p>
    </div>
  </aside>
</main>
<nav class="switcher" aria-label="Doubles podium variants">
  <button type="button" id="previous-variant" aria-label="Previous podium variant">←</button>
  <output id="variant-label" aria-live="polite"></output>
  <button type="button" id="next-variant" aria-label="Next podium variant">→</button>
</nav>

<script>
  const icons = {
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    back: '<path d="M19 12H5m7-7-7 7 7 7"/>',
    close: '<path d="m6 6 12 12m0-12L6 18"/>',
    search: '<circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4 4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/>',
    entrants: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m1 3a4 4 0 0 1 3 4v2"/>',
    prize: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 1v5m-4 2h8"/>',
    next: '<path d="m9 6 6 6-6 6"/>'
  };

  const people = JSON.parse(document.querySelector('#portraits').textContent);
  const pairs = [['7', '70'], ['13', '59'], ['98', '934']];
  const doublesSample = [
    { id: 'd1', name: 'BTTC Qoşa Reytinq Turniri #120', date: '18 noyabr 2026', count: '12 qoşa', prize: '100 AZN', winners: pairs },
    { id: 'd2', name: 'Bakı Qoşa Kuboku', date: '7–8 noyabr 2026', count: '16 qoşa', prize: '200 AZN', winners: [pairs[1], pairs[2], pairs[0]] },
    { id: 'd3', name: 'Payız Qoşa Turniri', date: '25 oktyabr 2026', count: '10 qoşa', prize: '80 AZN' }
  ];
  const singlesSample = [
    { id: 's1', name: 'Təhsil Şəxsi Reytinq Turniri', date: '19 noyabr 2026', count: '18 oyunçu', prize: '150 AZN', winners: [['13'], ['7'], ['934']] },
    { id: 's2', name: 'Bakı Şəxsi Kuboku', date: '14–16 noyabr 2026', count: '24 oyunçu', prize: '250 AZN', winners: [['70'], ['98'], ['59']] },
    { id: 's3', name: 'Payız Açıq Kuboku', date: '30 oktyabr 2026', count: '20 oyunçu', prize: '100 AZN' }
  ];
  const newTournaments = {
    doubles: { id: 'd-new', name: 'Noyabr Qoşa Kuboku', date: '21 noyabr 2026', count: '14 qoşa', prize: '180 AZN', winners: [pairs[2], pairs[0], pairs[1]] },
    singles: { id: 's-new', name: 'Noyabr Şəxsi Kuboku', date: '21 noyabr 2026', count: '32 oyunçu', prize: '300 AZN', winners: [['98'], ['13'], ['7']] }
  };
  const variants = [
    { key: 'A', heading: 'Stepped podium', description: 'Both partners’ photos and names share each medal step. The center gold step is tallest.' },
    { key: 'B', heading: 'Medal rows', description: 'One row per medal, with a photo next to each partner’s name. The order runs from gold to bronze.' },
    { key: 'C', heading: 'Gold spotlight', description: 'Gold gets the large paired photos. Silver and bronze keep both names in smaller, text-only placements.' }
  ];
  const titles = { rankings: 'Reytinq', singles: 'Şəxsi turnirlər', doubles: 'Qoşa turnirlər', duels: 'Duellər', results: 'Matç nəticələri' };
  const medalColors = ['gold', 'silver', 'bronze'];
  const medalNames = ['Qızıl', 'Gümüş', 'Bürünc'];
  const lists = { doubles: doublesSample, singles: singlesSample };
  const queries = { doubles: '', singles: '' };
  const unread = { doubles: false, singles: false };
  const params = new URLSearchParams(location.search);
  let variantIndex = Math.max(0, variants.findIndex(variant => variant.key === params.get('variant')));
  let view = 'doubles';
  let resultCategory = 'doubles';
  let selectedTournament = doublesSample[0];
  let newTournamentsVisible = false;

  const screen = document.querySelector('#screen');
  const appBar = document.querySelector('#app-bar');
  const overlay = document.querySelector('#overlay');
  const viewPicker = document.querySelector('#view');

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
  }

  function portrait(id) {
    return `<img class="portrait" src="${people[id].photo}" alt="">`;
  }

  function names(ids) {
    return `<div class="names">${ids.map(id => `<span>${people[id].name}</span>`).join('')}</div>`;
  }

  function portraits(ids) {
    return `<div class="portraits">${ids.map(portrait).join('')}</div>`;
  }

  function medal(position) {
    return `<span class="medal" role="img" aria-label="${medalNames[position]}">${position + 1}</span>`;
  }

  function steppedPodium(winners, isDoubles) {
    return `<div class="podium steps ${isDoubles ? 'paired' : ''}" aria-label="Mükafat kürsüsü">
      ${[1, 0, 2].map(position => `<div class="step ${medalColors[position]}">
        ${portraits(winners[position])}
        ${names(winners[position])}
        <span class="step-base" role="img" aria-label="${medalNames[position]}">${position + 1}</span>
      </div>`).join('')}
    </div>`;
  }

  function medalRows(winners) {
    return `<div class="podium medal-rows" aria-label="Mükafat kürsüsü">
      ${winners.map((ids, position) => `<div class="medal-row ${medalColors[position]}">
        ${medal(position)}
        <div class="row-pair">${ids.map(id => `<div class="row-player">${portrait(id)}${names([id])}</div>`).join('')}</div>
      </div>`).join('')}
    </div>`;
  }

  function goldSpotlight(winners) {
    return `<div class="podium spotlight" aria-label="Mükafat kürsüsü">
      <div class="spotlight-place gold">
        ${medal(0)}
        ${portraits(winners[0])}
        ${names(winners[0])}
      </div>
      <div class="spotlight-runners">
        ${[1, 2].map(position => `<div class="runner ${medalColors[position]}">
          ${medal(position)}${names(winners[position])}
        </div>`).join('')}
      </div>
    </div>`;
  }

  function podium(winners, isDoubles) {
    if (!winners) return '';
    if (!isDoubles || variantIndex === 0) return steppedPodium(winners, isDoubles);
    if (variantIndex === 1) return medalRows(winners);
    return goldSpotlight(winners);
  }

  function facts(tournament) {
    return `<div class="facts">
      <span>${icon('calendar')}${tournament.date}</span>
      <span>${icon('entrants')}${tournament.count}</span>
      <span>${icon('prize')}${tournament.prize}</span>
    </div>`;
  }

  function tournamentCard(tournament, isDoubles) {
    return `<article class="card tournament">
      <h3>${tournament.name}</h3>
      ${facts(tournament)}
      ${podium(tournament.winners, isDoubles)}
      <button class="card-link" type="button" data-tournament="${tournament.id}" aria-label="${tournament.name} — matç nəticələri">
        Matç nəticələri ${icon('next')}
      </button>
    </article>`;
  }

  function renderTournamentList() {
    const results = screen.querySelector('#tournament-list');
    const query = queries[view].trim().toLocaleLowerCase('az');
    const tournaments = newTournamentsVisible ? [newTournaments[view], ...lists[view]] : lists[view];
    const filtered = tournaments.filter(tournament => tournament.name.toLocaleLowerCase('az').includes(query));
    results.innerHTML = filtered.length
      ? filtered.map(tournament => tournamentCard(tournament, view === 'doubles')).join('')
      : '<p class="empty">Turnir tapılmadı.</p>';
  }

  function matchCard(left, right, score, stage) {
    return `<article class="card match">
      <div class="match-kind">${stage}</div>
      <div class="score-row"><span>${left.map(id => people[id].name).join(' / ')}</span><strong class="score">${score[0]}</strong></div>
      <div class="score-row"><span>${right.map(id => people[id].name).join(' / ')}</span><strong class="score">${score[1]}</strong></div>
    </article>`;
  }

  function renderScreen() {
    viewPicker.value = view;
    screen.scrollTop = 0;
    const goingBack = view === 'results';
    const hasUnread = Object.values(unread).some(Boolean);
    appBar.innerHTML = `<button class="icon-button" id="app-nav" type="button"
      aria-label="${goingBack ? 'Geri' : hasUnread ? 'Menyunu aç, yeni turnir var' : 'Menyunu aç'}"
      ${goingBack ? '' : 'aria-expanded="false" aria-controls="overlay"'}>${icon(goingBack ? 'back' : 'menu')}
      ${!goingBack && hasUnread ? '<span class="dot" aria-hidden="true"></span>' : ''}</button>
      <h2>${titles[view]}</h2>`;
    document.querySelector('#app-nav').addEventListener('click', goingBack ? () => navigate(resultCategory) : openDrawer);

    if (view === 'singles' || view === 'doubles') {
      screen.innerHTML = `<label class="search">${icon('search')}<span class="visually-hidden">Turnir adı ilə axtar</span>
        <input id="search" type="search" placeholder="Turnir adı ilə axtar" autocomplete="off">
      </label><div class="stack" id="tournament-list" aria-live="polite"></div>`;
      const input = screen.querySelector('#search');
      input.value = queries[view];
      input.addEventListener('input', () => {
        queries[view] = input.value;
        renderTournamentList();
      });
      renderTournamentList();
    } else if (view === 'results') {
      const winners = selectedTournament.winners || (resultCategory === 'doubles' ? pairs : [['13'], ['7'], ['98']]);
      screen.innerHTML = `<div class="stack">
        <div class="card"><h3 class="result-title">${selectedTournament.name}</h3>${facts(selectedTournament)}</div>
        <p class="day">${selectedTournament.date}</p>
        ${matchCard(winners[0], winners[1], [3, 1], 'Final')}
        ${matchCard(winners[0], winners[2], [3, 2], 'Yarımfinal')}
        ${matchCard(winners[1], winners[2], [3, 0], 'Qrup mərhələsi')}
      </div>`;
    } else if (view === 'duels') {
      screen.innerHTML = `<div class="stack">
        <p class="day">20 noyabr 2026</p>
        ${matchCard(['13'], ['70'], [3, 2], 'Şəxsi duel')}
        ${matchCard(pairs[0], pairs[1], [3, 1], 'Qoşa duel')}
        <p class="day">18 noyabr 2026</p>
        ${matchCard(['934'], ['98'], [2, 3], 'Şəxsi duel')}
      </div>`;
    } else {
      screen.innerHTML = `<div class="stack">${['13', '7', '70', '98'].map((id, index) =>
        `<div class="card ranking-row"><span>${index + 1}</span>${portrait(id)}<span>${people[id].name}</span>
        <strong>${[891, 845, 829, 780][index]} xal</strong></div>`).join('')}</div>`;
    }
  }

  function navigate(next, tournament) {
    closeDrawer(false);
    if (next === 'results') {
      if (tournament) {
        resultCategory = view;
        selectedTournament = tournament;
      }
    } else if (next === 'singles' || next === 'doubles') {
      unread[next] = false;
    }
    view = next;
    renderScreen();
  }

  function openDrawer() {
    overlay.innerHTML = `<section class="drawer" role="dialog" aria-modal="true" aria-label="Əsas menyu">
      <div class="drawer-title"><strong>TableTennisAz</strong>
      <button type="button" class="icon-button" data-close aria-label="Menyunu bağla">${icon('close')}</button></div>
      <nav class="drawer-nav" aria-label="Əsas menyu">${['rankings', 'singles', 'doubles', 'duels'].map(destination =>
        `<button type="button" class="destination" data-view="${destination}" ${destination === view ? 'aria-current="page"' : ''}>
          ${titles[destination]}${unread[destination] ? '<span class="dot" role="img" aria-label="Yeni turnir"></span>' : ''}
        </button>`).join('')}</nav>
      </section>`;
    overlay.hidden = false;
    document.querySelector('#app-nav').setAttribute('aria-expanded', 'true');
    overlay.querySelector('[data-close]').focus();
  }

  function closeDrawer(restoreFocus = true) {
    if (overlay.hidden) return;
    overlay.hidden = true;
    const button = document.querySelector('#app-nav');
    button.setAttribute('aria-expanded', 'false');
    if (restoreFocus) button.focus();
  }

  function renderVariant() {
    const variant = variants[variantIndex];
    document.querySelector('#variant-label').value = variant.key + ' · ' + variant.heading;
    document.querySelector('#variant-heading').textContent = variant.heading;
    document.querySelector('#variant-description').textContent = variant.description;
    if (view === 'doubles') renderTournamentList();
  }

  function changeVariant(step) {
    variantIndex = (variantIndex + step + variants.length) % variants.length;
    const url = new URL(location.href);
    url.searchParams.set('variant', variants[variantIndex].key);
    history.replaceState(null, '', url);
    renderVariant();
  }

  overlay.addEventListener('click', event => {
    if (event.target === overlay || event.target.closest('[data-close]')) closeDrawer();
    const destination = event.target.closest('[data-view]');
    if (destination) {
      navigate(destination.dataset.view);
      document.querySelector('#app-nav').focus();
    }
  });

  screen.addEventListener('click', event => {
    const button = event.target.closest('[data-tournament]');
    if (!button) return;
    const tournament = [newTournaments[view], ...lists[view]].find(item => item.id === button.dataset.tournament);
    navigate('results', tournament);
    document.querySelector('#app-nav').focus();
  });

  viewPicker.addEventListener('change', () => navigate(viewPicker.value));
  document.querySelector('#simulate').addEventListener('click', () => {
    newTournamentsVisible = true;
    unread.singles = true;
    unread.doubles = true;
    queries.singles = '';
    queries.doubles = '';
    navigate('rankings');
  });

  document.querySelector('#previous-variant').addEventListener('click', () => changeVariant(-1));
  document.querySelector('#next-variant').addEventListener('click', () => changeVariant(1));
  document.addEventListener('keydown', event => {
    if (!overlay.hidden) {
      if (event.key === 'Escape') closeDrawer();
      if (event.key === 'Tab') {
        const buttons = [...overlay.querySelectorAll('button')];
        const edge = event.shiftKey ? buttons[0] : buttons.at(-1);
        if (document.activeElement === edge) {
          event.preventDefault();
          (event.shiftKey ? buttons.at(-1) : buttons[0]).focus();
        }
      }
      return;
    }
    if (event.target.closest('input, select, textarea, [contenteditable]')) return;
    if (event.key === 'ArrowLeft') changeVariant(-1);
    if (event.key === 'ArrowRight') changeVariant(1);
  });

  renderScreen();
  renderVariant();
</script>
</body>
</html>
