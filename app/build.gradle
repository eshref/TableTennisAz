plugins { id 'com.android.application' }

def versionFile = rootProject.layout.projectDirectory.file('version.properties')
def appVersion = new Properties()
appVersion.load(new StringReader(providers.fileContents(versionFile).asText.get()))

android {
    namespace 'az.tabletennis'
    compileSdk 36
    defaultConfig {
        applicationId 'az.tabletennis'
        minSdk 26
        targetSdk 36
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.withType(Test).configureEach {
    maxHeapSize = "1g"
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
