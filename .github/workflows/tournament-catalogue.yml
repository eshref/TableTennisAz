name: Tournament catalogue
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      firebase_test_event_id:
        description: Results index ID to alert on the Firebase test topic after deployment
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/tournament-catalogue/**'
      - 'scripts/singles-index/**'
      - '.github/workflows/tournament-catalogue.yml'
  pull_request:
    paths:
      - 'scripts/tournament-catalogue/**'
      - 'scripts/singles-index/**'
      - '.github/workflows/tournament-catalogue.yml'

permissions:
  contents: read

concurrency:
  group: tournament-catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/tournament-catalogue/requirements.txt -r scripts/singles-index/requirements.txt
      - run: python -m unittest discover -s scripts/tournament-catalogue -v
      - run: python -m unittest discover -s scripts/singles-index -v

  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      catalogue_sha256: ${{ steps.catalogue-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/tournament-catalogue/requirements.txt -r scripts/singles-index/requirements.txt
      - name: Generate the catalogue for the existing site
        env:
          CATALOGUE_URL: ${{ steps.pages.outputs.base_url }}/tournaments-v1.json
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            "$CATALOGUE_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/previous-catalogue.json"
          cp -a docs pages-source
          python scripts/tournament-catalogue/generate.py --previous "$RUNNER_TEMP/previous-catalogue.json" \
            pages-source/tournaments-v1.json
      - name: Generate the complete head-to-head indexes
        run: |
          python scripts/singles-index/generate.py pages-source/singles-index-v1 \
            --doubles-output pages-source/doubles-index-v1
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages-source
          destination: ./_site
      - name: Record the catalogue being deployed
        id: catalogue-digest
        run: |
          sha256sum _site/tournaments-v1.json | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  firebase-test-alert:
    if: github.event_name == 'workflow_dispatch' && inputs.firebase_test_event_id != ''
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          create_credentials_file: false
          export_environment_variables: false
      - name: Confirm the live catalogue and send the test alert
        env:
          EVENT_ID: ${{ inputs.firebase_test_event_id }}
          PAGES_URL: ${{ needs.publish.outputs.page_url }}
          CATALOGUE_SHA256: ${{ needs.build.outputs.catalogue_sha256 }}
          FIREBASE_PROJECT: ${{ steps.firebase.outputs.project_id }}
          FCM_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: |
          python3 scripts/tournament-catalogue/send_test_alert.py \
            --catalogue "${PAGES_URL%/}/tournaments-v1.json" --sha256 "$CATALOGUE_SHA256" \
            --project "$FIREBASE_PROJECT" -- "$EVENT_ID"
