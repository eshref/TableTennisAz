name: Tournament catalogue
on:
  schedule:
    - cron: '17 0,8,12,16,20 * * *'
      timezone: Asia/Baku
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/tournament-catalogue/**'
      - 'scripts/singles-index/**'
      - '.github/workflows/tournament-catalogue.yml'
  pull_request:
    paths:
      - 'scripts/tournament-catalogue/**'
      - 'scripts/singles-index/**'
      - '.github/workflows/tournament-catalogue.yml'

permissions:
  contents: read

concurrency:
  group: tournament-catalogue-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/tournament-catalogue/requirements.txt -r scripts/singles-index/requirements.txt
      - run: python -m unittest discover -s scripts/tournament-catalogue -v
      - run: python -m unittest discover -s scripts/singles-index -v

  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      catalogue_sha256: ${{ steps.catalogue-digest.outputs.sha256 }}
      previous_catalogue_sha256: ${{ steps.catalogue-digest.outputs.previous_sha256 }}
      page_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/tournament-catalogue/requirements.txt -r scripts/singles-index/requirements.txt
      - name: Generate the catalogue for the existing site
        env:
          CATALOGUE_URL: ${{ steps.pages.outputs.base_url }}/tournaments-v1.json
          ALERTS_ENABLED: ${{ vars.TOURNAMENT_ALERTS_ENABLED }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --dump-header "$RUNNER_TEMP/previous-catalogue.headers" \
            "$CATALOGUE_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/previous-catalogue.json"
          modified=$(awk 'tolower($1) == "last-modified:" {sub(/^[^:]*: */, ""); sub(/\r$/, ""); value=$0} END {print value}' \
            "$RUNNER_TEMP/previous-catalogue.headers")
          alerts=()
          if [[ "$ALERTS_ENABLED" == true ]]; then alerts+=(--track-alerts); fi
          cp -a docs pages-source
          python scripts/tournament-catalogue/generate.py --previous "$RUNNER_TEMP/previous-catalogue.json" \
            --previous-modified "$modified" "${alerts[@]}" pages-source/tournaments-v1.json
      - name: Choose the daily head-to-head refresh date
        id: head-to-head
        run: date -u '+date=%F' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: head-to-head-cache
        with:
          path: ${{ runner.temp }}/head-to-head-indexes
          key: head-to-head-indexes-${{ hashFiles('scripts/singles-index/generate.py', 'scripts/singles-index/requirements.txt') }}-${{ steps.head-to-head.outputs.date }}
          restore-keys: head-to-head-indexes-${{ hashFiles('scripts/singles-index/generate.py', 'scripts/singles-index/requirements.txt') }}-
      - name: Generate the complete head-to-head indexes
        id: refresh-head-to-head
        if: steps.head-to-head-cache.outputs.cache-hit != 'true'
        run: |
          indexes="$RUNNER_TEMP/head-to-head-indexes"
          refreshed=$(mktemp -d "$RUNNER_TEMP/head-to-head-refresh.XXXXXX")
          if python scripts/singles-index/generate.py "$refreshed/singles-index-v1" \
            --doubles-output "$refreshed/doubles-index-v1"; then
            mkdir -p "$indexes"
            cp -a "$refreshed/." "$indexes/"
            echo 'refreshed=true' >> "$GITHUB_OUTPUT"
          elif [[ -d "$indexes/singles-index-v1" && -d "$indexes/doubles-index-v1" ]]; then
            echo '::warning::The head-to-head refresh failed. Publishing the last successful indexes.'
          else
            exit 1
          fi
      - uses: actions/cache/save@v4
        if: steps.refresh-head-to-head.outputs.refreshed == 'true'
        with:
          path: ${{ runner.temp }}/head-to-head-indexes
          key: ${{ steps.head-to-head-cache.outputs.cache-primary-key }}
      - name: Include the head-to-head indexes in Pages
        run: cp -a "$RUNNER_TEMP/head-to-head-indexes/." pages-source/
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages-source
          destination: ./_site
      - name: Record the catalogue being deployed
        id: catalogue-digest
        run: |
          sha256sum _site/tournaments-v1.json | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/previous-catalogue.json" | awk '{print "previous_sha256=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    steps:
      - name: Check that publication history has not advanced since the build
        id: catalogue
        env:
          PAGE_URL: ${{ needs.build.outputs.page_url }}
          PREVIOUS_SHA256: ${{ needs.build.outputs.previous_catalogue_sha256 }}
          CANDIDATE_SHA256: ${{ needs.build.outputs.catalogue_sha256 }}
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 --header 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/tournaments-v1.json?publish=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -o "$RUNNER_TEMP/live.json"
          live_sha256=$(sha256sum "$RUNNER_TEMP/live.json" | awk '{print $1}')
          if [[ "$live_sha256" == "$PREVIOUS_SHA256" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [[ "$live_sha256" != "$CANDIDATE_SHA256" ]]; then
            echo 'The live catalogue has advanced. Build a new catalogue before deploying.' >&2
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        if: steps.catalogue.outputs.deploy == 'true'

  firebase-alerts:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.TOURNAMENT_ALERTS_ENABLED == 'true' }}
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - name: Load the latest Firebase receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          artifact=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" | \
            jq -sr --arg repository "$GITHUB_REPOSITORY_ID" '
              [.[].artifacts[] | select(.expired == false and (.name | startswith("tournament-alert-receipts-")))
                | select(.workflow_run.head_branch == "main" and (.workflow_run.head_repository_id | tostring) == $repository)]
              | max_by(.id) | .id // empty')
          if [[ -n "$artifact" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/receipts.zip"
            unzip -p "$RUNNER_TEMP/receipts.zip" tournament-alert-receipts.json > "$RUNNER_TEMP/previous-receipts.json"
          fi
      - uses: google-github-actions/auth@v3
        id: firebase
        with:
          credentials_json: ${{ secrets.FIREBASE_TOURNAMENT_ALERTS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          create_credentials_file: false
          export_environment_variables: false
      - name: Send pending alerts from the live catalogue
        id: send
        env:
          CATALOGUE_URL: ${{ steps.pages.outputs.base_url }}/tournaments-v1.json
          CATALOGUE_SHA256: ${{ needs.publish.result == 'success' && github.run_attempt == '1' && needs.build.outputs.catalogue_sha256 || '' }}
          FIREBASE_PROJECT: ${{ steps.firebase.outputs.project_id }}
          FCM_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: |
          deployment=()
          if [[ -n "$CATALOGUE_SHA256" ]]; then deployment+=(--sha256 "$CATALOGUE_SHA256"); fi
          python3 scripts/tournament-catalogue/publish_alerts.py --catalogue "$CATALOGUE_URL" "${deployment[@]}" \
            --receipts "$RUNNER_TEMP/previous-receipts.json" \
            --accepted "$RUNNER_TEMP/tournament-alert-receipts.json" --project "$FIREBASE_PROJECT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.send.outcome != 'skipped' }}
        with:
          name: tournament-alert-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tournament-alert-receipts.json
          if-no-files-found: ignore
          retention-days: 2
