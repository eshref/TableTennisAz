name: Publish Android release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run the full signed fixture matrix on Android 16 without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: android-release
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      apk_sha256: ${{ steps.signed.outputs.apk_sha256 }}
      fixture_matrix: ${{ steps.fixtures.outputs.matrix }}
    steps:
      - name: Check dispatch ref
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch the Android release workflow from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan saved-fixture journeys
        id: fixtures
        run: python3 scripts/android/release-matrix.py plan >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          args=("$RUNNER_TEMP/android-release")
          if [[ "$VERIFY_ONLY" == true ]]; then
            args+=(--verify-only)
          fi
          scripts/android/validate-release-candidate "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android host checks
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Build and verify signed APK
        id: signed
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          candidate="$RUNNER_TEMP/android-release"
          scripts/android/build-release-candidate "$candidate" "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          digest=$(sha256sum "$candidate/TableTennisAz-$RELEASE_VERSION_NAME.apk")
          printf 'apk_sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: TableTennisAz-${{ steps.metadata.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
          overwrite: true

  verify-signed:
    name: Verify signed APK (${{ matrix.journey }})
    needs: candidate
    if: inputs.verify_only
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.fixture_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      JOURNEY: ${{ matrix.journey }}
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version_name }}
      CANDIDATE_SHA256: ${{ needs.candidate.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: TableTennisAz-${{ needs.candidate.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
      - name: Grant the runner access to KVM
        id: kvm
        run: |
          if [[ -c /dev/kvm && ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Run installed preflight and saved-fixture matrix
        id: installed
        timeout-minutes: 110
        env:
          TEST_CLASS: az.tabletennis.${{ matrix.test }}
        run: |
          set -o pipefail
          export ANDROID_VERIFY_OUTPUT="$RUNNER_TEMP/android-release-evidence"
          mkdir -p "$ANDROID_VERIFY_OUTPUT"
          scripts/android-verify --require-kvm --device-only --tests "$TEST_CLASS" \
            --release-candidate "$RUNNER_TEMP/android-release/TableTennisAz-$CANDIDATE_VERSION.apk" "$CANDIDATE_SHA256" \
            2>&1 | tee "$ANDROID_VERIFY_OUTPUT/progress.log"
      - name: Summarize signed verification
        if: always()
        env:
          VERIFICATION_OUTCOME: ${{ steps.installed.outcome }}
        run: |
          ANDROID_VERIFY_OUTPUT="$RUNNER_TEMP/android-release-evidence"
          mkdir -p "$ANDROID_VERIFY_OUTPUT"
          printf 'installed=%s\n' "$VERIFICATION_OUTCOME" > "$ANDROID_VERIFY_OUTPUT/job.properties"
          {
            printf '## Signed Android verification\n\n'
            printf 'Commit `%s` · Candidate `TableTennisAz-%s.apk` · SHA-256 `%s`\n\n' "$GITHUB_SHA" "$CANDIDATE_VERSION" "$CANDIDATE_SHA256"
            printf 'Android API 36 · Journey `%s` · Installed matrix **%s**\n\n' "$JOURNEY" "$VERIFICATION_OUTCOME"
            printf 'Download `android-signed-api36-%s` from this run’s artifacts.\n' "$JOURNEY"
            for result in "$ANDROID_VERIFY_OUTPUT"/run-*/result.properties; do
              [[ -f "$result" ]] || continue
              printf '\n```properties\n'
              cat "$result"
              printf '```\n'
            done
          } | tee "$ANDROID_VERIFY_OUTPUT/verification.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-api36-${{ matrix.journey }}
          path: ${{ runner.temp }}/android-release-evidence
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  fixture-summary:
    name: Summarize signed fixture matrix
    needs: [candidate, verify-signed]
    if: always() && inputs.verify_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: android-signed-api36-*
          path: ${{ runner.temp }}/android-signed-journeys
      - name: Report fixture coverage and collect validated screenshots
        if: always()
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version_name }}
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.apk_sha256 }}
          FIXTURE_RESULT: ${{ needs.verify-signed.result }}
        run: |
          python3 scripts/android/release-matrix.py "$RUNNER_TEMP/android-signed-journeys" \
            "$RUNNER_TEMP/android-signed-fixture-matrix" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-signed-fixture-matrix
          path: ${{ runner.temp }}/android-signed-fixture-matrix
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    needs: candidate
    if: inputs.verify_only == false
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}'
      - uses: actions/download-artifact@v4
        with:
          name: TableTennisAz-${{ needs.candidate.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ secrets.ANDROID_RELEASE_GITHUB_TOKEN || github.token }}
        run: python3 scripts/android/release.py publish "$RUNNER_TEMP/android-release" "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
