name: Publish Android release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify a signed candidate on Android 16 without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: android-release
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      apk_sha256: ${{ steps.signed.outputs.apk_sha256 }}
    steps:
      - name: Check dispatch ref
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch the Android release workflow from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          args=("$RUNNER_TEMP/android-release")
          if [[ "$VERIFY_ONLY" == true ]]; then
            args+=(--verify-only)
          fi
          scripts/android/validate-release-candidate "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android host checks
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Build and verify signed APK
        id: signed
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          candidate="$RUNNER_TEMP/android-release"
          scripts/android/build-release-candidate "$candidate" "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          digest=$(sha256sum "$candidate/TableTennisAz-$RELEASE_VERSION_NAME.apk")
          printf 'apk_sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: TableTennisAz-${{ steps.metadata.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
          overwrite: true

  verify-signed:
    name: Verify signed APK on Android 16
    needs: candidate
    if: inputs.verify_only
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      ANDROID_VERIFY_OUTPUT: ${{ github.workspace }}/android-release-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: TableTennisAz-${{ needs.candidate.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
      - name: Grant the runner access to KVM
        id: kvm
        run: |
          if [[ -c /dev/kvm && ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Run installed preflight and rating history journey
        id: installed
        timeout-minutes: 110
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version_name }}
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.apk_sha256 }}
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_VERIFY_OUTPUT"
          scripts/android-verify --require-kvm --focused --tests az.tabletennis.RatingHistoryDeviceTest \
            --release-candidate "$RUNNER_TEMP/android-release/TableTennisAz-$CANDIDATE_VERSION.apk" "$CANDIDATE_SHA256" \
            2>&1 | tee "$ANDROID_VERIFY_OUTPUT/progress.log"
      - name: Summarize signed verification
        if: always()
        env:
          VERIFICATION_OUTCOME: ${{ steps.installed.outcome }}
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.apk_sha256 }}
        run: |
          mkdir -p "$ANDROID_VERIFY_OUTPUT"
          {
            printf '## Signed Android verification\n\n'
            printf 'Commit `%s` · Candidate SHA-256 `%s`\n\n' "$GITHUB_SHA" "$CANDIDATE_SHA256"
            printf 'Android API 36 · Rating history · Standard light · **%s**\n\n' "$VERIFICATION_OUTCOME"
            printf 'Download `android-signed-api36-rating-history` from this run’s artifacts.\n'
            for result in "$ANDROID_VERIFY_OUTPUT"/run-*/result.properties; do
              [[ -f "$result" ]] || continue
              printf '\n```properties\n'
              cat "$result"
              printf '```\n'
            done
          } | tee "$ANDROID_VERIFY_OUTPUT/verification.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-api36-rating-history
          path: ${{ env.ANDROID_VERIFY_OUTPUT }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: candidate
    if: inputs.verify_only == false
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}'
      - uses: actions/download-artifact@v4
        with:
          name: TableTennisAz-${{ needs.candidate.outputs.version_name }}-candidate
          path: ${{ runner.temp }}/android-release/
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ secrets.ANDROID_RELEASE_GITHUB_TOKEN || github.token }}
        run: python3 scripts/android/release.py publish "$RUNNER_TEMP/android-release" "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
